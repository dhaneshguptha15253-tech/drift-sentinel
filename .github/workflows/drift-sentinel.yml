name: Drift Sentinel PR Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  drift-sentinel-comment:
    name: Post test PR comment
    runs-on: ubuntu-latest

    steps:
      - name: Post hardcoded test comment
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              "## Drift Sentinel — CI test",
              "",
              "The GitHub Actions PR-comment integration is working.",
              "",
              "This is the Part 1 test comment. Shape comparison and usage-aware",
              "breaking-change analysis will be added in the next stage."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
